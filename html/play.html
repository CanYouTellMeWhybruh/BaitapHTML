<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play</title>
    <link rel="stylesheet" href="../styles/reset.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main-style/general.css">
    <link rel="stylesheet" href="../styles/main-style/main.css">
    <link rel="stylesheet" href="../styles/main-style/header.css">
    <link rel="stylesheet" href="../styles/menu.css">
    <link rel="stylesheet" href="../styles/main-style/choice.css">
</head>
<body>
    <div class="container">
        <div class="operation">
            <ul>
                <li>
                    <label for="Addition">
                        <div class="border-radio">
                            <input type="radio" id="Addition" name="operation" value="+" checked>
                        </div>
                        Addition
                    </label>
                </li>
                <li>
                    <label for="Subtraction">
                        <div class="border-radio">
                            <input type="radio" id="Subtraction" name="operation" value="-">
                        </div>
                        Subtraction
                    </label>
                </li>
                <li>
                    <label for="Multiplication">
                        <div class="border-radio">
                            <input type="radio" id="Multiplication" name="operation" value="×">
                        </div>
                        Multiplication
                    </label>
                </li>
                <li>
                    <label for="Division">
                        <div class="border-radio">
                            <input type="radio" id="Division" name="operation" value="÷">
                        </div>
                        Division
                    </label>
                </li>
            </ul>
        </div>
        <div class="scope">
            <ul>
                <li>
                    <label for="1-9">
                        <div class="border-radio">
                            <input type="radio" name="check2" id="1-9" value="9" checked>
                        </div>
                        1 to 9
                    </label>
                </li>
                <li>
                    <label for="1-19">
                        <div class="border-radio">
                            <input type="radio" name="check2" id="1-19" value="19">
                        </div>
                        1 to 19
                    </label>
                </li>
                <li>
                    <label for="1-29">
                        <div class="border-radio">
                            <input type="radio" name="check2" id="1-29" value="29">
                        </div>
                        1 to 29
                    </label>
                </li>
                <li>
                    <label for="1-39">
                        <div class="border-radio">
                            <input type="radio" name="check2" id="1-39" value="39">
                        </div>
                        1 to 39
                    </label>
                </li>
                <li>
                    <label for="1-49">
                        <div class="border-radio">
                            <input type="radio" name="check2" id="1-49" value="49">
                        </div>
                        1 to 49
                    </label>
                </li>
                <li>
                    <label for="1-99">
                        <div class="border-radio">
                            <input type="radio" name="check2" id="1-99" value="99">
                        </div>
                        1 to 99
                    </label>
                </li>
            </ul>
            <button id="start-button" onclick="doSomething();">Start</button>
        </div>
    </div>
    
    <script src="../js/main.js"></script>
</body>
</html>
